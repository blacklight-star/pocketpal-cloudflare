name: Goldstar MCP Staging Checks

on:
  push:
    branches:
      - staging/goldstar-mcp-oauth
    paths:
      - workers/goldstar-mcp-staging/**
      - .github/workflows/goldstar-mcp-staging-check.yml
  pull_request:
    paths:
      - workers/goldstar-mcp-staging/**
      - .github/workflows/goldstar-mcp-staging-check.yml

permissions:
  contents: read

jobs:
  auth-check:
    name: Auth Worker type-check and dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/goldstar-mcp-staging/auth
    steps:
      - name: Checkout staging source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check Auth Worker
        run: npm run type-check
      - name: Dry-run Auth Worker build
        run: npx wrangler deploy --dry-run --outdir=.wrangler-dry-run

  resource-check:
    name: Resource Worker type-check and dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/goldstar-mcp-staging/resource
    steps:
      - name: Checkout staging source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check Resource Worker
        run: npm run type-check
      - name: Dry-run Resource Worker build
        run: npx wrangler deploy --dry-run --outdir=.wrangler-dry-run
