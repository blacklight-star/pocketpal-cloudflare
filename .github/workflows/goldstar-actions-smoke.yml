name: Goldstar Actions Runner Smoke Test

on:
  push:
    branches:
      - staging/goldstar-mcp-oauth

permissions:
  contents: read

jobs:
  single-runner-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Auth working directory
        working-directory: workers/goldstar-mcp-staging/auth
        run: pwd
      - name: Check Resource working directory
        working-directory: workers/goldstar-mcp-staging/resource
        run: pwd
