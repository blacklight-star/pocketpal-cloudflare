name: Goldstar MCP Staging CI

on:
  push:
    branches:
      - staging/goldstar-mcp-oauth

permissions:
  contents: read

jobs:
  auth-check:
    name: Auth Worker type-check and dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Auth dependencies
        working-directory: workers/goldstar-mcp-staging/auth
        run: npm install --no-audit --no-fund
      - name: Type-check Auth Worker
        working-directory: workers/goldstar-mcp-staging/auth
        run: npm run type-check
      - name: Dry-run Auth Worker
        working-directory: workers/goldstar-mcp-staging/auth
        run: npx wrangler deploy --dry-run --outdir=.wrangler-dry-run

  resource-check:
    name: Resource Worker type-check and dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Resource dependencies
        working-directory: workers/goldstar-mcp-staging/resource
        run: npm install --no-audit --no-fund
      - name: Type-check Resource Worker
        working-directory: workers/goldstar-mcp-staging/resource
        run: npm run type-check
      - name: Dry-run Resource Worker
        working-directory: workers/goldstar-mcp-staging/resource
        run: npx wrangler deploy --dry-run --outdir=.wrangler-dry-run
